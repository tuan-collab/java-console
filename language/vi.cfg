0ninetutorial=Luật chơi Sudoku 9x9:
1ninetutorial=1) Cấu trúc bảng: Sudoku thường được chơi trên bảng 9x9, chia thành các vùng 3x3 gọi là 'khu vực' hoặc 'hộp'.
2ninetutorial=2) Mục tiêu: Điền đầy đủ bảng sao cho mỗi hàng, mỗi cột, và mỗi vùng 3x3 chứa tất cả các chữ số từ 1 đến 9 mà không lặp lại bất kỳ chữ số nào.
3ninetutorial=3) Gợi ý ban đầu: Bài toán bắt đầu với một số ô đã được điền sẵn các chữ số (đây là gợi ý của bạn).
4ninetutorial=4) Không lặp lại: Bạn không thể lặp lại bất kỳ chữ số nào trong bất kỳ hàng, cột, hoặc vùng 3x3 nào.
5ninetutorial=5) Đặt logic: Sử dụng suy luận logic để suy ra các chữ số cho các ô trống dựa trên gợi ý ban đầu và các chữ số đã được đặt.
0sixtutorial=Luật chơi Sudoku 6x6:
1sixtutorial=1) Cấu trúc bảng: Bảng Sudoku 6x6 được chia thành các vùng 2x3.
2sixtutorial=2) Mục tiêu: Điền đầy đủ bảng sao cho mỗi hàng, mỗi cột, và mỗi vùng 2x3 chứa tất cả các chữ số từ 1 đến 6 mà không lặp lại bất kỳ chữ số nào.
3sixtutorial=3) Gợi ý ban đầu: Bài toán bắt đầu với một số ô đã được điền sẵn các chữ số (đây là gợi ý của bạn).
4sixtutorial=4) Không lặp lại: Bạn không thể lặp lại bất kỳ chữ số nào trong bất kỳ hàng, cột, hoặc vùng 2x3 nào.
5sixtutorial=5) Đặt logic: Sử dụng suy luận logic để suy ra các chữ số cho các ô trống dựa trên gợi ý ban đầu và các chữ số đã được đặt.
0tipstutorial=Mẹo cho người mới bắt đầu:
1tipstutorial=1) Bắt đầu với những điều hiển nhiên: Tìm kiếm các chữ số đã có trong bảng và xem chúng phải đi vào đâu trong mỗi hàng, cột, và khu vực.
2tipstutorial=2) Cross-Hatching: Kiểm tra từng chữ số qua tất cả các hàng và cột để xem nó có thể phù hợp ở đâu trong các khu vực.
3tipstutorial=3) Chì chấm: Ghi lại các chữ số có thể vào lề của các ô trống (hữu ích cho các câu đố phức tạp).
